# =============================================================================
#  Integración continua: se ejecuta en cada push a main y en cada pull request.
#  Si algún paso falla, el PR queda marcado en rojo y (con la regla de
#  protección configurada) no se puede integrar.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias exactas (package-lock.json)
        run: npm ci

      - name: Análisis estático
        run: npm run lint

      - name: Pruebas con cobertura
        run: npm test -- --coverage

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
